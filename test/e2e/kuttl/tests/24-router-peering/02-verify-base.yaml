# Step 2 — both routers Ready+Synced; the transit network is attached to BOTH
# simultaneously (multi-router attachment, US2). Conditions waited by TYPE.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: kubectl -n timeweb-e2e wait --for=condition=Ready --timeout=1800s router/e2e-peer-a router/e2e-peer-b
    timeout: 1860
  - script: kubectl -n timeweb-e2e wait --for=condition=Synced --timeout=300s router/e2e-peer-a router/e2e-peer-b
    timeout: 360
  - timeout: 360
    script: |
      # Context lock (fail-closed): explicit E2E_KUBECONTEXT must match; without
      # it only a single-context kubeconfig (the harness minified one) may run —
      # a multi-context kubeconfig aborts rather than risk a non-e2e cluster.
      cur=$(kubectl config current-context); n=$(kubectl config get-contexts -o name | wc -l | tr -d " ")
      if [ -n "${E2E_KUBECONTEXT:-}" ]; then [ "$cur" = "$E2E_KUBECONTEXT" ] || { echo "FAIL: context $cur != $E2E_KUBECONTEXT"; exit 1; }
      elif [ "$n" != "1" ]; then echo "FAIL: $n contexts available and E2E_KUBECONTEXT unset — refusing to guess (current: $cur)"; exit 1; fi
      tid=$(kubectl -n timeweb-e2e get network/e2e-peer-transit -o jsonpath='{.status.atProvider.upstreamID}')
      for i in $(seq 1 30); do
        a=$(kubectl -n timeweb-e2e get router/e2e-peer-a -o jsonpath='{.status.atProvider.networks[*].id}')
        b=$(kubectl -n timeweb-e2e get router/e2e-peer-b -o jsonpath='{.status.atProvider.networks[*].id}')
        case "$a" in *"$tid"*) case "$b" in *"$tid"*) echo "transit on both routers"; exit 0;; esac;; esac
        sleep 10
      done
      echo "FAIL: transit $tid not attached to both (A=$a B=$b)"; exit 1
