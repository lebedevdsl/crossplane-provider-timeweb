# Step 1 — feature 024: autoscaling day-2. Minimal cluster + an AUTOSCALED
# public pool (min 2 / max 3). Reproduces the 2026-07-25/26 manual probe run.
apiVersion: kubernetes.m.timeweb.crossplane.io/v1alpha1
kind: KubernetesCluster
metadata: {name: e2e-as-cl, namespace: timeweb-e2e}
spec:
  providerConfigRef: {kind: ProviderConfig, name: e2e}
  forProvider:
    name: e2e-as-cl
    k8sVersion: "${TWE_K8S_VERSION}"
    networkDriver: cilium
    location: ${TWE_LOCATION}
    availabilityZone: ${TWE_AZ}
    presetName: ${TWE_K8S_MASTER_PRESET}
---
apiVersion: kubernetes.m.timeweb.crossplane.io/v1alpha1
kind: KubernetesClusterNodepool
metadata: {name: e2e-as-pool, namespace: timeweb-e2e}
spec:
  providerConfigRef: {kind: ProviderConfig, name: e2e}
  forProvider:
    name: e2e-as-pool
    presetName: ${TWE_K8S_WORKER_PRESET}
    nodeCount: 2
    autoscaling: {enabled: true, minSize: 2, maxSize: 3}
    clusterRef: {name: e2e-as-cl}
