# Step 5 — day-2 off→on with bounds (manual probe P-3 reproduced): declare
# autoscaling back; converge = count no longer reconciled, no flapping.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 660
    script: |
      cur=$(kubectl config current-context); n=$(kubectl config get-contexts -o name | wc -l | tr -d " ")
      if [ -n "${E2E_KUBECONTEXT:-}" ]; then [ "$cur" = "$E2E_KUBECONTEXT" ] || { echo "FAIL: context $cur != $E2E_KUBECONTEXT"; exit 1; }
      elif [ "$n" != "1" ]; then echo "FAIL: $n contexts and E2E_KUBECONTEXT unset — refusing to guess (current: $cur)"; exit 1; fi
      kubectl -n timeweb-e2e patch kubernetesclusternodepool/e2e-as-pool --type=merge -p '{"spec":{"forProvider":{"autoscaling":{"enabled":true,"minSize":2,"maxSize":3}}}}'
      kubectl -n timeweb-e2e wait --for=condition=Synced --timeout=600s kubernetesclusternodepool/e2e-as-pool
