# Step 3 — THE INCIDENT SHAPE (manual probe P-1 reproduced declaratively):
# flip autoscaling off and lower nodeCount in ONE edit. The provider must
# disable the flag first and only then converge the count — never fighting a
# still-enabled autoscaler.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 60
    script: |
      cur=$(kubectl config current-context); n=$(kubectl config get-contexts -o name | wc -l | tr -d " ")
      if [ -n "${E2E_KUBECONTEXT:-}" ]; then [ "$cur" = "$E2E_KUBECONTEXT" ] || { echo "FAIL: context $cur != $E2E_KUBECONTEXT"; exit 1; }
      elif [ "$n" != "1" ]; then echo "FAIL: $n contexts and E2E_KUBECONTEXT unset — refusing to guess (current: $cur)"; exit 1; fi
      kubectl -n timeweb-e2e patch kubernetesclusternodepool/e2e-as-pool --type=json -p '[{"op":"remove","path":"/spec/forProvider/autoscaling"},{"op":"replace","path":"/spec/forProvider/nodeCount","value":1}]'
