name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write  # required for cosign keyless signing

jobs:
  release:
    name: build + sign + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Pinned download, NOT `curl … main/install.sh | sh` (feature 025 audit
      # M-4): this job holds packages:write AND id-token:write, so arbitrary
      # code here could publish AND validly sign a backdoored package. Mirrors
      # the pattern ci.yaml already uses.
      - name: Install Crossplane CLI
        env:
          XP_VERSION: v2.1.3
        run: |
          curl -fsSL "https://releases.crossplane.io/stable/${XP_VERSION}/bin/linux_amd64/crank" -o /tmp/crossplane
          chmod +x /tmp/crossplane
          sudo mv /tmp/crossplane /usr/local/bin/crossplane
          crossplane --help >/dev/null && echo "crossplane CLI ${XP_VERSION} installed"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run code generation
        run: make generate

      # Embed model: the controller runtime is baked INTO the .xpkg, so there is
      # no separate controller image. `make release` builds the per-arch embedded
      # package(s), pushes them as one (multi-arch) index to ghcr, then
      # cosign-signs that package ref (keyless via the id-token below).
      # Provider.spec.package = ghcr.io/lebedevdsl/provider-timeweb:<tag>.
      - name: Build embedded package, push to ghcr, and cosign-sign
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          make release \
            IMAGE_REPO=ghcr.io/lebedevdsl/provider-timeweb \
            VERSION="${VERSION}"

      # SBOM + attestation (feature 025 audit M-5): signing alone tells a
      # consumer nothing about contents. The SBOM is attested against the same
      # DIGEST `make release` signed, so verification covers both.
      - name: Generate SBOM and attest it to the published digest
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMAGE_REPO=ghcr.io/lebedevdsl/provider-timeweb
          digest=$(crossplane xpkg extract --help >/dev/null 2>&1; \
            docker buildx imagetools inspect "${IMAGE_REPO}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "attesting SBOM for ${IMAGE_REPO}@${digest}"
          curl -fsSL https://raw.githubusercontent.com/anchore/syft/v1.18.1/install.sh -o /tmp/syft-install.sh
          echo "  (syft installer pinned to v1.18.1)"
          sh /tmp/syft-install.sh -b /usr/local/bin v1.18.1
          syft "${IMAGE_REPO}@${digest}" -o spdx-json=/tmp/sbom.spdx.json
          cosign attest --yes --predicate /tmp/sbom.spdx.json \
            --type spdxjson "${IMAGE_REPO}@${digest}"

      # Publish the GitHub release: notes (docs/release-notes/<tag>.md) + a
      # standard one-command Install section, with install.yaml attached as an
      # asset (the Provider manifest pinned to this tag).
      - name: Publish GitHub release with install.yaml
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash hack/publish-release.sh "${{ github.ref_name }}"
