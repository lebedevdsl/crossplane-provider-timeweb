# Example S3Bucket managed resource for the Timeweb Crossplane provider.
#
# The controller publishes a connection Secret (type: Opaque) containing
# endpoint / bucket / region. As of feature 012 it NO LONGER contains
# access_key / secret_key — those were account-admin keys (full access to every
# bucket). For scoped, per-bucket credentials, create an S3User (see
# examples/s3user.yaml) and consume ITS connection Secret.
#
# IMMUTABLE FIELDS: name.
# Mutable: type, description, projectID, initialSizeGB (within the same class —
# the resolver re-resolves the tier and PATCHes it). storageClass is a
# create-time choice: if upstream later reports a different class, updates are
# refused until the spec is aligned (see the StorageClassDrift condition).
#
# See docs/presets.md for the full initialSizeGB + storageClass field reference.
# See docs/s3bucket.md for lifecycle and conditions.
---
apiVersion: objectstorage.m.timeweb.crossplane.io/v1alpha1
kind: S3Bucket
metadata:
  name: demo-images
  namespace: timeweb-prod
spec:
  forProvider:
    # IMMUTABLE — globally unique bucket name (3-63 chars, lowercase + digits + . -).
    name: demo-images
    # MUTABLE — access policy: private or public.
    type: public
    # Pick the tier by disk size. Valid values: 1, 10, 100, 250 (GB); cold: 1 only.
    initialSizeGB: 10
    # Storage class, by Timeweb panel name: standard (Standard — recommended),
    # hot (Premium — not orderable since 2026-10-14), cold (pay-as-you-go, 1 GB).
    storageClass: standard
    description: "User-uploaded images for example.com"
    # Optional project assignment (resolves via ProjectRef or ProjectID).
    # projectID: 12345
  # Connection Secret destination — keys: endpoint, bucket, region.
  writeConnectionSecretToRef:
    name: demo-images-creds
    # namespace defaults to the MR's namespace if omitted
  providerConfigRef:
    kind: ProviderConfig
    name: default
